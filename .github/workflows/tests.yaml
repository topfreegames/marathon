name: Test
on: push

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 8585:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      zookeeper:
        image: wurstmeister/zookeeper
        ports:
          - 9930:2181
      kafka:
        image: bitnami/kafka:latest # ALTERADO: Usando a imagem Bitnami Kafka
        ports:
          - 9940:9092
        env:
          # Variáveis de ambiente para Bitnami Kafka
          KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
          KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9940
          KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false" # Não criaremos tópicos automaticamente aqui, faremos em um step
        options: >-
          # Health check para Bitnami Kafka
          --health-cmd "/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"
          --health-interval 30s
          --health-timeout 20s
          --health-retries 30
      redis:
        image: redis
        ports:
          - 6333:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.19'

    - name: Install librdkafka
      run: |
        sudo apt-get update
        sudo apt-get install -y libsasl2-dev
        LIBRDKAFKA_VERSION=v0.11.6 ./travis.sh

    - name: Wait for services
      run: |
        echo "Waiting for PostgreSQL to be ready..."
        for i in $(seq 1 30); do
          if PGPASSWORD= marathon_test_user psql -h localhost -p 8585 -U marathon_test_user -d marathon_test -c '\q' 2>/dev/null; then
            echo "PostgreSQL is ready."
            break
          fi
          echo "Still waiting for PostgreSQL..."
          sleep 2
          if [ "$i" -eq 30 ]; then echo "Timeout waiting for PostgreSQL."; exit 1; fi
        done

        echo "Waiting for Kafka broker to be healthy..."
        for i in $(seq 1 30); do
          # Usa o health check do Docker para verificar o status do serviço Kafka
          if docker inspect --format="{{if .Config.Healthcheck}}{{print .State.Health.Status}}{{end}}" $(docker ps -q --filter ancestor=bitnami/kafka --filter health=healthy) | grep -q "healthy"; then
            echo "Kafka broker is healthy."
            break
          fi
          echo "Still waiting for Kafka broker health..."
          sleep 5 # Espera um pouco mais entre as verificações de saúde do broker
          if [ "$i" -eq 30 ]; then echo "Timeout waiting for Kafka broker to become healthy."; exit 1; fi
        done

    # Adicionado: Criação explícita dos tópicos Kafka
    - name: Create Kafka topics
      run: |
        /opt/bitnami/kafka/bin/kafka-topics.sh --create --bootstrap-server localhost:9092 --replication-factor 1 --partitions 1 --topic consumer
        /opt/bitnami/kafka/bin/kafka-topics.sh --create --bootstrap-server localhost:9092 --replication-factor 1 --partitions 1 --topic consumergcm
        /opt/bitnami/kafka/bin/kafka-topics.sh --create --bootstrap-server localhost:9092 --replication-factor 1 --partitions 1 --topic consumerapns
      # Adicione uma dependência no serviço 'kafka' para que este step só comece depois que o Kafka estiver saudável
      # Isso já é implicitamente feito pela ordem dos steps, mas é bom ter em mente.

    - name: Create test databases
      run: |
        make db-test

    - name: Run migrations for test databases
      run: |
        go run main.go migrations up -c config/test.yaml -m migrations
        go run main.go migrations up -c config/test.yaml -m test_migrations

    - name: Run tests
      run: make test