name: CI
on: push
jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 8585:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      zookeeper:
        image: wurstmeister/zookeeper
        ports:
          - 9930:2181
      kafka:
        image: wurstmeister/kafka:0.10.1.0-2
        ports:
          - 9940:9092
        env:
          KAFKA_ADVERTISED_HOST_NAME: localhost
          KAFKA_ADVERTISED_PORT: 9940
          KAFKA_CREATE_TOPICS: "consumer:1:1,consumergcm:1:1,consumerapns:1:1"
          KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
        options: >-
          --health-cmd "kafka-topics.sh --bootstrap-server localhost:9940 --list || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis
        ports:
          - 6333:6379

    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.19

    - name: Install librdkafka
      run: |
        sudo apt-get update
        sudo apt-get install -y libsasl2-dev
        LIBRDKAFKA_VERSION=v0.11.6 ./travis.sh

    - name: Wait for services
      run: |
        echo "Waiting for PostgreSQL to be ready..."
        for i in $(seq 1 30); do
          if PGPASSWORD= marathon_test_user psql -h localhost -p 8585 -U marathon_test_user -d marathon_test -c '\q'; then
            echo "PostgreSQL is ready."
            break
          fi
          echo "Still waiting for PostgreSQL..."
          sleep 2
        done

        echo "Waiting for Kafka to be ready..."
        for i in $(seq 1 30); do
          if docker run --network host wurstmeister/kafka:0.10.1.0-2 kafka-topics.sh --bootstrap-server localhost:9940 --list; then
            echo "Kafka is ready."
            break
          fi
          echo "Still waiting for Kafka..."
          sleep 2
        done
      env:
        PGPASSWORD: "" # Empty password for trust authentication as per db/create-test.sql

    - name: Create test databases
      run: |
        make db-test

    - name: Run migrations for test databases
      run: |
        go run main.go migrations up -c config/test.yaml -m migrations
        go run main.go migrations up -c config/test.yaml -m test_migrations


    - name: Run tests
      run: make test